[default]
description = "Default app permissions - allows all custom commands"
permissions = ["allow-create-server-config", "allow-get-server-configs", "allow-delete-server-config", "allow-add-client-to-server", "allow-delete-client", "allow-get-client-configs", "allow-create-client-config", "allow-update-client-config", "allow-delete-client-config", "allow-update-server-settings", "allow-start-server", "allow-stop-server", "allow-get-callback-url", "allow-authorize-client", "allow-cancel-authorization", "allow-fetch-server-metadata"]

[[permission]]
identifier = "allow-create-server-config"
description = "Allow creating server configurations"
commands.allow = ["create_server_config"]

[[permission]]
identifier = "allow-get-server-configs"
description = "Allow reading server configurations"
commands.allow = ["get_server_configs"]

[[permission]]
identifier = "allow-delete-server-config"
description = "Allow deleting server configurations"
commands.allow = ["delete_server_config"]

[[permission]]
identifier = "allow-add-client-to-server"
description = "Allow adding clients to server configurations"
commands.allow = ["add_client_to_server"]

[[permission]]
identifier = "allow-delete-client"
description = "Allow deleting clients"
commands.allow = ["delete_client"]

[[permission]]
identifier = "allow-get-client-configs"
description = "Allow reading client configurations"
commands.allow = ["get_client_configs"]

[[permission]]
identifier = "allow-create-client-config"
description = "Allow creating client configurations"
commands.allow = ["create_client_config"]

[[permission]]
identifier = "allow-update-client-config"
description = "Allow updating client configurations"
commands.allow = ["update_client_config"]

[[permission]]
identifier = "allow-delete-client-config"
description = "Allow deleting client configurations"
commands.allow = ["delete_client_config"]

[[permission]]
identifier = "allow-update-server-settings"
description = "Allow updating server settings (redirect override, token expiry)"
commands.allow = ["update_server_settings"]

[[permission]]
identifier = "allow-start-server"
description = "Allow starting OAuth servers"
commands.allow = ["start_server"]

[[permission]]
identifier = "allow-stop-server"
description = "Allow stopping OAuth servers"
commands.allow = ["stop_server"]

[[permission]]
identifier = "allow-get-callback-url"
description = "Allow getting the OAuth callback URL"
commands.allow = ["get_callback_url"]

[[permission]]
identifier = "allow-authorize-client"
description = "Allow authorizing with OAuth client configurations"
commands.allow = ["authorize_client"]

[[permission]]
identifier = "allow-cancel-authorization"
description = "Allow cancelling a pending authorization"
commands.allow = ["cancel_authorization"]

[[permission]]
identifier = "allow-fetch-server-metadata"
description = "Allow fetching OAuth authorization server metadata"
commands.allow = ["fetch_server_metadata"]
