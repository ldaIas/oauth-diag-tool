<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="main.js"></script>
    <script>
      var app = Elm.Main.init({ node: document.getElementById("app") });

      function waitForTauri(callback) {
        if (window.__TAURI__) {
          callback();
          return;
        }
        const interval = setInterval(function() {
          if (window.__TAURI__) {
            clearInterval(interval);
            callback();
          }
        }, 50);
      }

      function loadServerConfigs() {
        window.__TAURI__.core.invoke("get_server_configs").then(function(configs) {
          app.ports.receiveServerConfigs.send(configs);
        }).catch(function(err) { console.error("get_server_configs failed:", err); });
      }

      app.ports.requestServerConfigs.subscribe(function() {
        waitForTauri(loadServerConfigs);
      });

      app.ports.deleteServerConfig.subscribe(function(data) {
        waitForTauri(function() {
          window.__TAURI__.core.invoke("delete_server_config", {
            id: parseInt(data.id, 10)
          }).then(function() {
            loadServerConfigs();
          }).catch(function(err) { console.error("delete_server_config failed:", err); });
        });
      });

      app.ports.createServerConfig.subscribe(function(config) {
        console.log("createServerConfig called")
        waitForTauri(function() {
          window.__TAURI__.core.invoke("create_server_config", {
            configName: config.configName,
            authServerUrl: config.authServerUrl,
            tokenUrl: config.tokenUrl
          }).then(function() {
            loadServerConfigs();
          }).catch(function(err) { console.error("create_server_config failed:", err); });
        });
      });
    </script>
  </body>
</html>
