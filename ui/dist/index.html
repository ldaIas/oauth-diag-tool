<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="main.js"></script>
    <script>
      var app = Elm.Main.init({ node: document.getElementById("app") });

      async function checkForUpdates() {
        try {
          var check = await window.__TAURI__.updater.check();
          if (check && check.available) {
            var accepted = await window.__TAURI__.dialog.confirm(
              "A new version (" + check.version + ") is available. Would you like to update now?",
              { title: "Update Available", kind: "info" }
            );
            if (accepted) {
              await check.downloadAndInstall();
              await window.__TAURI__.process.relaunch();
            }
          }
        } catch (err) {
          console.error("Update check failed:", err);
        }
      }

      function waitForTauri(callback) {
        if (window.__TAURI__) {
          callback();
          return;
        }
        var interval = setInterval(function() {
          if (window.__TAURI__) {
            clearInterval(interval);
            callback();
          }
        }, 50);
      }

      waitForTauri(checkForUpdates);

      function loadServerConfigs() {
        window.__TAURI__.core.invoke("get_server_configs").then(function(configs) {
          app.ports.receiveServerConfigs.send(configs);
        }).catch(function(err) { console.error("get_server_configs failed:", err); });
      }

      function loadClientConfigs() {
        window.__TAURI__.core.invoke("get_client_configs").then(function(configs) {
          app.ports.receiveClientConfigs.send(configs);
        }).catch(function(err) { console.error("get_client_configs failed:", err); });
      }

      app.ports.requestServerConfigs.subscribe(function() {
        waitForTauri(loadServerConfigs);
      });

      app.ports.requestClientConfigs.subscribe(function() {
        waitForTauri(loadClientConfigs);
      });

      app.ports.deleteServerConfig.subscribe(function(data) {
        waitForTauri(function() {
          window.__TAURI__.core.invoke("delete_server_config", {
            id: parseInt(data.id, 10)
          }).then(function() {
            loadServerConfigs();
          }).catch(function(err) { console.error("delete_server_config failed:", err); });
        });
      });

      app.ports.createServerConfig.subscribe(function(config) {
        waitForTauri(function() {
          window.__TAURI__.core.invoke("create_server_config", {
            configName: config.configName,
            authServerUrl: config.authServerUrl,
            tokenUrl: config.tokenUrl
          }).then(function() {
            loadServerConfigs();
          }).catch(function(err) { console.error("create_server_config failed:", err); });
        });
      });

      app.ports.addClientToServer.subscribe(function(data) {
        waitForTauri(function() {
          window.__TAURI__.core.invoke("add_client_to_server", {
            authServerId: parseInt(data.authServerId, 10)
          }).then(function() {
            loadServerConfigs();
          }).catch(function(err) { console.error("add_client_to_server failed:", err); });
        });
      });

      app.ports.deleteClient.subscribe(function(data) {
        waitForTauri(function() {
          window.__TAURI__.core.invoke("delete_client", {
            id: parseInt(data.id, 10)
          }).then(function() {
            loadServerConfigs();
          }).catch(function(err) { console.error("delete_client failed:", err); });
        });
      });

      app.ports.createClientConfig.subscribe(function(config) {
        waitForTauri(function() {
          window.__TAURI__.core.invoke("create_client_config", {
            name: config.name,
            issuerUrl: config.issuerUrl,
            authorizationUrl: config.authorizationUrl,
            tokenUrl: config.tokenUrl,
            clientId: config.clientId,
            clientSecret: config.clientSecret,
            scopes: config.scopes,
            grantType: config.grantType,
            extraParams: config.extraParams,
            disabledParams: config.disabledParams,
            disabledTokenParams: config.disabledTokenParams,
            scopesSupported: config.scopesSupported || "",
            disabledRefreshParams: config.disabledRefreshParams || "{}"
          }).then(function() {
            loadClientConfigs();
          }).catch(function(err) { console.error("create_client_config failed:", err); });
        });
      });

      app.ports.updateClientConfig.subscribe(function(config) {
        waitForTauri(function() {
          window.__TAURI__.core.invoke("update_client_config", {
            id: parseInt(config.id, 10),
            name: config.name,
            issuerUrl: config.issuerUrl,
            authorizationUrl: config.authorizationUrl,
            tokenUrl: config.tokenUrl,
            clientId: config.clientId,
            clientSecret: config.clientSecret,
            scopes: config.scopes,
            grantType: config.grantType,
            extraParams: config.extraParams,
            disabledParams: config.disabledParams,
            disabledTokenParams: config.disabledTokenParams,
            scopesSupported: config.scopesSupported || "",
            disabledRefreshParams: config.disabledRefreshParams || "{}"
          }).then(function() {
            loadClientConfigs();
          }).catch(function(err) { console.error("update_client_config failed:", err); });
        });
      });

      app.ports.fetchServerMetadata.subscribe(function(data) {
        waitForTauri(function() {
          window.__TAURI__.core.invoke("fetch_server_metadata", {
            issuerUrl: data.issuerUrl
          }).then(function(result) {
            result.configId = data.configId || "";
            app.ports.receiveServerMetadata.send(result);
          }).catch(function(err) {
            console.error("fetch_server_metadata failed:", err);
            app.ports.receiveServerMetadata.send({
              configId: data.configId || "",
              body: "Error: " + err,
              authorizationEndpoint: "",
              tokenEndpoint: "",
              scopesSupported: ""
            });
          });
        });
      });

      app.ports.deleteClientConfig.subscribe(function(data) {
        waitForTauri(function() {
          window.__TAURI__.core.invoke("delete_client_config", {
            id: parseInt(data.id, 10)
          }).then(function() {
            loadClientConfigs();
          }).catch(function(err) { console.error("delete_client_config failed:", err); });
        });
      });

      app.ports.updateServerSettings.subscribe(function(data) {
        waitForTauri(function() {
          window.__TAURI__.core.invoke("update_server_settings", {
            id: parseInt(data.id, 10),
            redirectUrlOverride: data.redirectUrlOverride,
            accessTokenExpiry: data.accessTokenExpiry,
            refreshTokenExpiry: data.refreshTokenExpiry
          }).then(function() {
            loadServerConfigs();
          }).catch(function(err) { console.error("update_server_settings failed:", err); });
        });
      });

      app.ports.startServer.subscribe(function(data) {
        waitForTauri(function() {
          window.__TAURI__.core.invoke("start_server", {
            id: parseInt(data.id, 10)
          }).then(function() {
            loadServerConfigs();
          }).catch(function(err) { console.error("start_server failed:", err); });
        });
      });

      app.ports.stopServer.subscribe(function(data) {
        waitForTauri(function() {
          window.__TAURI__.core.invoke("stop_server", {
            id: parseInt(data.id, 10)
          }).then(function() {
            loadServerConfigs();
          }).catch(function(err) { console.error("stop_server failed:", err); });
        });
      });

      app.ports.requestCallbackUrl.subscribe(function() {
        waitForTauri(function() {
          window.__TAURI__.core.invoke("get_callback_url").then(function(url) {
            app.ports.receiveCallbackUrl.send(url);
          }).catch(function(err) { console.error("get_callback_url failed:", err); });
        });
      });

      app.ports.cancelAuthorization.subscribe(function(data) {
        waitForTauri(function() {
          window.__TAURI__.core.invoke("cancel_authorization", {
            id: parseInt(data.id, 10)
          }).catch(function(err) { console.error("cancel_authorization failed:", err); });
        });
      });

      waitForTauri(function() {
        window.__TAURI__.event.listen("resource-access", function(event) {
          app.ports.receiveResourceAccess.send(event.payload);
        });
      });

      app.ports.refreshToken.subscribe(function(data) {
        waitForTauri(function() {
          window.__TAURI__.core.invoke("refresh_token", {
            id: parseInt(data.id, 10)
          }).then(function(result) {
            result.configId = data.id;
            try { result.body = JSON.stringify(JSON.parse(result.body), null, 2); } catch(e) {}
            app.ports.receiveAuthResult.send(result);
          }).catch(function(err) {
            console.error("refresh_token failed:", err);
            app.ports.receiveAuthResult.send({
              configId: data.id,
              statusCode: 0,
              headers: [],
              body: "Error: " + err
            });
          });
        });
      });

      app.ports.authorizeClient.subscribe(function(data) {
        waitForTauri(function() {
          window.__TAURI__.core.invoke("authorize_client", {
            id: parseInt(data.id, 10)
          }).then(function(result) {
            result.configId = data.id;
            try { result.body = JSON.stringify(JSON.parse(result.body), null, 2); } catch(e) {}
            app.ports.receiveAuthResult.send(result);
          }).catch(function(err) {
            console.error("authorize_client failed:", err);
            app.ports.receiveAuthResult.send({
              configId: data.id,
              statusCode: 0,
              headers: [],
              body: "Error: " + err
            });
          });
        });
      });
    </script>
  </body>
</html>
